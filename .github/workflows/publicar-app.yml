# Publica la app web (carpeta app/) en GitHub Pages cada vez que hay cambios en main.
# Requisito (una sola vez): Settings › Pages › Source: «GitHub Actions».
name: Publicar app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/publicar-app.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: despliegue
        uses: actions/deploy-pages@v4
